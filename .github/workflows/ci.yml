name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Healing layer 1a: retry install to absorb transient network/registry failures.
      - name: Install (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Record start
        id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Healing layer 1b: pytest.ini reruns flaky failures automatically.
      - name: Test
        run: pytest

      - name: Build image
        run: docker build -t self-healing-demo:${{ github.sha }} .

      # Detect: record build duration and flag anomalies vs rolling baseline.
      - name: Build-metric anomaly check
        if: always()
        run: |
          END=$(date +%s)
          python scripts/anomaly_check.py $(( END - ${{ steps.t0.outputs.start }} ))

      # Persist metric history so the baseline grows across runs (main only).
      - name: Persist metrics
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add metrics/history.jsonl || true
          git commit -m "chore(ci): record build metric [skip ci]" || echo "no change"
          git push || echo "push skipped"
