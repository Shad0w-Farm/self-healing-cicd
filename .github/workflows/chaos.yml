name: Chaos (demo trigger)

# Manually injects a failure so the audience can watch the pipeline detect and heal it.
# Run from the Actions tab -> Chaos -> Run workflow -> pick a failure type.
on:
  workflow_dispatch:
    inputs:
      failure_type:
        description: "What to break"
        type: choice
        required: true
        options:
          - flaky        # -> heal: rerun
          - lint         # -> heal: fix_forward
          - dependency   # -> heal: revert
          - bug          # -> heal: revert
        default: flaky

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "chaos-bot"
          git config user.email "chaos-bot@users.noreply.github.com"

      - name: Inject failure
        run: |
          case "${{ github.event.inputs.failure_type }}" in
            flaky)
              mkdir -p chaos && echo "on" > chaos/flaky.on
              git add chaos/flaky.on
              git commit -m "chaos: enable flaky test"
              ;;
            lint)
              printf '\n\ndef   badly_formatted( ):\n  x=1;y=2\n  return x+y\n' >> app/main.py
              git commit -am "chaos: introduce lint violation"
              ;;
            dependency)
              sed -i 's/^fastapi==.*/fastapi==999.999.999/' requirements.txt
              git commit -am "chaos: pin nonexistent dependency version"
              ;;
            bug)
              sed -i 's/"status": "ok"/"status": "BROKEN"/' app/main.py
              git commit -am "chaos: introduce failing behaviour"
              ;;
          esac
          git push
